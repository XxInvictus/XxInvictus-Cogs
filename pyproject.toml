[project]
name = "gameservers-cog-dev"
version = "0.1.0"
description = "Dev environment for the GameServers RED cog"
requires-python = ">=3.8.1,<3.9"

[dependency-groups]
dev = [
    "Red-DiscordBot>=3.5.24,<3.6",
    "pip>=25.0.1",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
